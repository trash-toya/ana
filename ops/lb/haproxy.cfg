# P4-5 — sticky routing on the visitor, so one visitor's batches for one session
# serialize on one ingest instance (session_guard row locks stay local).
#
# 8080 is the deployed shape; 8081 is the control used by the drill to show what
# happens without affinity. `hdr(...)` hashes the SDK-supplied X-Analytics-Route
# and `hash-type consistent` keeps key→instance mapping stable when a backend is
# added or removed (the LB drill asserts the affinity, not the algorithm).

global
  log stdout format raw local0
  maxconn 4000

defaults
  mode http
  log global
  option httplog
  timeout connect 2s
  timeout client 30s
  timeout server 30s

frontend sticky
  bind :18080
  default_backend ingest_hash

frontend control
  bind :18081
  default_backend ingest_roundrobin

backend ingest_hash
  balance hdr(X-Analytics-Route)
  hash-type consistent
  server ingest_a 127.0.0.1:3101 check
  server ingest_b 127.0.0.1:3102 check

backend ingest_roundrobin
  balance roundrobin
  server ingest_a 127.0.0.1:3101 check
  server ingest_b 127.0.0.1:3102 check
